# Stage 9 — Evaluation Golden Set (JobPulse)

> ۱۶ نمونه رزومه → آگهی‌های مرتبط مورد انتظار (۴ نمونه در ۲۰۲۶-۱۰-۰۲ اضافه شد).
> روش برچسب‌گذاری: خواندن دستی `title_clean` + `category` +
> `required_skills` + ابتدای `description_clean` هر آگهی (نه خروجی سیستم).
> قانون: آگهی‌ای expected است که هم‌حوزه و هم‌سطح رزومه باشد؛ آگهی‌های
> حوزه نامرتبط (حتی با امتیاز بالا) expected نیستند.

